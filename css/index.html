<!-- 
  ============================================================================
  北京交通大学智慧食堂实时动态监测系统 - 前端页面
  技术栈: HTML5 + Tailwind CSS 3 + JavaScript (ES6+)
  功能: 实时显示食堂窗口排队情况、餐桌占用状态、统计数据
  更新频率: 每3秒自动刷新一次数据
  ============================================================================
-->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 字符编码设置为UTF-8，确保中文正常显示 -->
    <meta charset="UTF-8">
    
    <!-- 响应式设计设置：viewport宽度等于设备宽度，初始缩放比例为1 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 网页标题，显示在浏览器标签上 -->
    <title>北京交通大学智慧食堂</title>
    
    <!-- 引入 Tailwind CSS 3 的 CDN 版本 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 自定义CSS样式 -->
    <style>
        /* 
           餐桌网格布局样式：
           - 使用CSS Grid创建10列8行的网格
           - 每个单元格大小为60px
           - 单元格之间间距为10px
        */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(10, 1fr);  /* 10列，每列等宽 */
            grid-template-rows: repeat(8, 60px);     /* 8行，每行60px高 */
            gap: 10px;                               /* 单元格间距 */
        }

        /* 
           排队小人样式：
           - 圆形图标，表示排队的人
           - 添加脉冲动画效果，让小人看起来有活力
           - 可点击，鼠标悬停时变成手型
        */
        .person {
            width: 16px;                    /* 宽度 */
            height: 16px;                   /* 高度 */
            background: #60a5fa;            /* 蓝色背景 */
            border-radius: 50%;             /* 圆形 */
            display: inline-block;          /* 行内块元素 */
            margin-right: 3px;              /* 右边距 */
            animation: pulse 1.5s infinite; /* 脉冲动画，1.5秒循环一次 */
            cursor: pointer;                /* 鼠标悬停显示手型 */
            transition: all 0.2s ease;      /* 过渡效果 */
            position: relative;             /* 相对定位，用于tooltip */
            border: 2px solid #3b82f6;      /* 蓝色边框 */
        }

        .person:hover {
            transform: scale(1.3);          /* 悬停时放大 */
            background: #3b82f6;           /* 悬停时颜色变深 */
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); /* 添加发光效果 */
        }

        /* 排队小人提示框 */
        .person-tooltip {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            z-index: 100;
            border: 1px solid #374151;
            margin-bottom: 5px;
        }

        .person:hover .person-tooltip {
            display: block;
        }

        .person-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #374151;
        }

        /* 
           脉冲动画关键帧：
           - 0%: 正常大小，完全不透明
           - 50%: 放大1.2倍，透明度70%
           - 100%: 恢复正常大小和透明度
        */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 
           餐桌样式：
           - 添加过渡动画效果，切换状态时更平滑
           - 可点击，鼠标悬停显示手型
        */
        .table {
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
        }

        .table:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        /* 
           餐桌状态样式：
           - table-occupied: 占用状态（红色背景，有人图标）
           - table-empty: 空闲状态（绿色背景，椅子图标）
           - table-maintenance: 维护状态（黄色背景，维修图标）
        */
        .table-occupied { 
            background: linear-gradient(145deg, #fca5a5, #ef4444); 
            border: 2px solid #dc2626;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        
        .table-empty { 
            background: linear-gradient(145deg, #86efac, #22c55e); 
            border: 2px solid #16a34a;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }
        
        .table-maintenance { 
            background: linear-gradient(145deg, #fcd34d, #f59e0b); 
            border: 2px solid #d97706;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        /* 餐桌编号显示 */
        .table-number {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 8px;
            opacity: 0.7;
        }

        /* 餐桌光晕效果 */
        .table-glow {
            position: absolute;
            inset: -4px;
            border-radius: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
            filter: blur(8px);
        }

        .table-occupied:hover .table-glow {
            background: rgba(239, 68, 68, 0.5);
            opacity: 1;
        }

        .table-empty:hover .table-glow {
            background: rgba(34, 197, 94, 0.5);
            opacity: 1;
        }

        /* 
           统计卡片样式：
           - 添加悬停效果，鼠标移上去会向上移动并显示阴影
        */
        .stat-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);           /* 向上移动5px */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); /* 添加阴影效果 */
        }

        /* 
           窗口卡片样式：
           - 可点击按钮样式
           - 悬停和点击效果
        */
        .window-card {
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid #475569;
        }

        .window-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border-color: #60a5fa;
            background-color: #1e293b;
        }

        .window-card:active {
            transform: translateY(-1px);
        }

        .window-card.closed {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .window-card.closed:hover {
            transform: none;
            box-shadow: none;
            border-color: #475569;
        }

        /* 
           弹窗样式：
           - 半透明背景遮罩
           - 居中显示弹窗
        */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background-color: #1f2937;
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #374151;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #374151;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #60a5fa;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #374151;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background-color: #4b5563;
            transform: scale(1.1);
        }

        /* 菜单项目样式 */
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #374151;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .menu-item:hover {
            background-color: #4b5563;
            transform: translateX(5px);
        }

        .menu-item-info {
            flex: 1;
        }

        .menu-item-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .menu-item-meta {
            display: flex;
            gap: 12px;
            font-size: 0.875rem;
            color: #9ca3af;
        }

        .menu-item-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #22c55e;
        }

        /* 排队人员列表样式 */
        .queue-person-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            background-color: #374151;
            border-radius: 8px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
        }

        .queue-person-item:hover {
            background-color: #4b5563;
        }

        .queue-person-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            margin-right: 12px;
            font-size: 14px;
        }

        .queue-person-info {
            flex: 1;
        }

        .queue-person-name {
            font-weight: 500;
            font-size: 14px;
        }

        .queue-person-wait {
            font-size: 12px;
            color: #f59e0b;
        }

        .queue-position {
            font-size: 10px;
            color: #9ca3af;
            background-color: #1f2937;
            padding: 4px 8px;
            border-radius: 10px;
        }

        /* 空状态样式 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
    </style>
</head>

<!-- 
   页面主体：
   - 使用 Tailwind CSS 的深色主题背景（bg-slate-900）
   - 文字颜色为白色（text-white）
   - 内边距为6个单位（p-6）
-->
<body class="bg-slate-900 text-white p-6">

       主容器：
       - 最大宽度为7xl（约1280px）
       - 水平居中（mx-auto）
    -->

        <!-- 
           页面头部（header）：
           - 包含标题和图例说明
           - 使用flex布局，两端对齐
        -->

            <!-- 标题区域 -->
            <div>
                <h1 class="text-3xl font-bold text-blue-400">BJTU智慧食堂实时动态监测</h1>
                <p class="text-slate-400">数据每 3 秒自动更新一次 | 点击窗口查看菜单 | 点击排队小人查看详情</p>
            </div>
            
            <!-- 图例说明 -->
            <div class="flex space-x-6 text-sm">
                <div class="flex items-center"><span class="w-3 h-3 bg-green-500 rounded-full mr-2"></span>空闲</div>
                <div class="flex items-center"><span class="w-3 h-3 bg-red-500 rounded-full mr-2"></span>占用</div>
                <div class="flex items-center"><span class="w-3 h-3 bg-yellow-500 rounded-full mr-2"></span>维护中</div>
            </div>
        </header>

        <!-- 
           统计卡片区域：
           - 使用grid布局，4列显示
           - 包含：总人数、用餐桌数、空闲桌数、平均等待时间
        -->
        <section class="grid grid-cols-4 gap-4 mb-8">
            <!-- 总人数卡片 -->
            <div class="stat-card bg-slate-800 p-4 rounded-xl border border-slate-700">
                <div class="text-slate-400 text-sm mb-1">总人数</div>
                <div id="stat-people" class="text-2xl font-bold text-blue-400">--</div>
            </div>
            
            <!-- 用餐桌数卡片 -->
            <div class="stat-card bg-slate-800 p-4 rounded-xl border border-slate-700">
                <div class="text-slate-400 text-sm mb-1">用餐桌数</div>
                <div id="stat-occupied" class="text-2xl font-bold text-green-400">--</div>
            </div>
            
            <!-- 空闲桌数卡片 -->
            <div class="stat-card bg-slate-800 p-4 rounded-xl border border-slate-700">
                <div class="text-slate-400 text-sm mb-1">空闲桌数</div>
                <div id="stat-empty" class="text-2xl font-bold text-red-400">--</div>
            </div>
            
            <!-- 平均等待时间卡片 -->

                <div class="text-slate-400 text-sm mb-1">平均等待</div>
                <div id="stat-wait" class="text-2xl font-bold text-yellow-400">--</div>

        </section>

        <!-- 
           窗口排队区域：

           - 共8个窗口卡片

                <div class="flex items-center justify-between">

                    <span class="ml-2 text-xs text-blue-400 cursor-pointer hover:text-blue-300" id="menu-btn-2">查看菜单</span>

                    <span class="font-bold">3号窗口</span>
                    <span class="text-xs text-slate-400">--</span>
                </div>
                <div class="text-sm text-slate-400 mb-2" id="window-3-name">加载中...</div>
                <div class="flex items-center justify-between">
                    <div id="queue-3" class="h-8 flex items-center overflow-hidden bg-slate-900 rounded px-2 flex-1"></div>
                    <span class="ml-2 text-xs text-blue-400 cursor-pointer hover:text-blue-300" id="menu-btn-3">查看菜单</span>

           餐桌布局区域：

           - 共80张桌子，由JavaScript动态生成

       - 显示排队人员列表和各自等待时间

    <!--

    -->

        <div class="modal">
            <div class="modal-header">
                <h2 id="table-modal-title" class="modal-title">餐桌详情</h2>
                <button id="table-modal-close" class="modal-close">&times;</button>
            </div>
            <div id="table-modal-content">
                <!-- 动态内容 -->
            </div>
        </div>
    </div>

    <!-- 
       JavaScript 代码区域：
       - 负责从后端API获取数据
       - 更新页面显示
       - 定时刷新数据（每3秒）
       - 处理弹窗交互
    -->
    <script>
        // API基础地址，指向后端服务器
        const API_BASE = 'http://localhost:8888/api';

        // 存储窗口数据和菜单数据
        let windowsData = [];
        let menuData = [];

        /**
         * 从API获取窗口数据
         */
        async function fetchWindows() {
            try {
                const response = await fetch(`${API_BASE}/windows`);
                const data = await response.json();
                windowsData = data;
                updateWindows(data);
            } catch (error) {
                console.error('获取窗口数据失败:', error);
            }
        }

        /**
         * 从API获取菜单数据
         */
        async function fetchMenu() {
            try {
                const response = await fetch(`${API_BASE}/menu`);
                const data = await response.json();
                menuData = data;
            } catch (error) {
                console.error('获取菜单数据失败:', error);
            }
        }

        /**
         * 更新窗口显示
         * @param {Array} windows - 窗口数据数组
         */
        function updateWindows(windows) {
            windows.forEach(win => {
                const nameEl = document.getElementById(`window-${win.id}-name`);
                const timeEl = document.querySelector(`#window-${win.id} .text-xs`);
                const queueEl = document.getElementById(`queue-${win.id}`);
                const windowCard = document.getElementById(`window-${win.id}`);
                
                if (nameEl) nameEl.textContent = win.name;
                
                if (timeEl) {
                    timeEl.textContent = win.status === 'closed' ? '已关闭' : `预计等待 ${win.waitTime}`;
                    timeEl.style.color = win.status === 'closed' ? '#ef4444' : '#9ca3af';
                }
                
                // 更新窗口卡片状态
                if (windowCard) {
                    if (win.status === 'closed') {
                        windowCard.classList.add('closed');
                    } else {
                        windowCard.classList.remove('closed');
                    }
                }
                
                // 更新排队小人显示
                if (queueEl) {
                    queueEl.innerHTML = '';
                    
                    if (win.status === 'closed') {
                        queueEl.innerHTML = '<span class="text-red-400 text-xs">窗口关闭</span>';
                    } else {
                        // 根据排队人数生成对应数量的小人
                        for (let j = 0; j < win.queueCount; j++) {
                            const person = document.createElement('div');
                            person.className = 'person';
                            
                            // 根据位置设置不同颜色
                            const colors = ['#60a5fa', '#3b82f6', '#2563eb', '#1d4ed8', '#1e40af', 
                                            '#1e3a8a', '#f87171', '#ef4444', '#dc2626', '#b91c1c'];
                            const colorIndex = Math.min(j, colors.length - 1);
                            person.style.backgroundColor = colors[colorIndex];
                            person.style.borderColor = colors[colorIndex];
                            
                            // 添加tooltip显示排队位置
                            const tooltip = document.createElement('div');
                            tooltip.className = 'person-tooltip';
                            tooltip.textContent = `第${j + 1}位，等待约${Math.ceil((j + 1) * 1.2)}分钟`;
                            person.appendChild(tooltip);
                            
                            // 添加点击事件
                            person.addEventListener('click', () => {
                                showQueueModal(win.id, win.name, j + 1);
                            });
                            
                            queueEl.appendChild(person);
                        }
                        
                        // 如果排队人数为0，显示提示
                        if (win.queueCount === 0) {
                            queueEl.innerHTML = '<span class="text-green-400 text-xs">暂无排队</span>';
                        }
                    }
                }
            });
        }

        /**
         * 显示排队人员弹窗
         * @param {number} windowId - 窗口ID
         * @param {string} windowName - 窗口名称
         * @param {number} position - 点击的小人位置
         */
        function showQueueModal(windowId, windowName, position) {
            const windowData = windowsData.find(w => w.id === windowId);
            if (!windowData) return;
            
            const modal = document.getElementById('queue-modal');
            const modalTitle = document.getElementById('queue-modal-title');
            const modalContent = document.getElementById('queue-modal-content');
            
            modalTitle.textContent = `${windowName} - 排队详情`;
            
            // 生成排队人员列表
            const peopleCount = windowData.queueCount;
            if (peopleCount === 0) {
                modalContent.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-users"></i>
                        </div>
                        <p>当前无人排队</p>
                    </div>
                `;
            } else {
                let html = `
                    <div class="mb-4 p-3 bg-slate-700 rounded-lg">
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-400">当前排队人数</span>
                            <span class="font-bold text-blue-400">${peopleCount}人</span>
                        </div>
                        <div class="flex justify-between text-sm mt-1">
                            <span class="text-slate-400">预计总等待时间</span>
                            <span class="font-bold text-yellow-400">${windowData.waitTime}</span>
                        </div>
                    </div>
                    <div class="space-y-2">
                `;
                
                // 生成每个人的信息
                const names = ['张三', '李四', '王五', '赵六', '钱七', '孙八', '周九', '吴十', '郑十一', '王十二',
                               '陈十三', '刘十四', '杨十五', '黄十六', '赵十七'];
                
                for (let i = 0; i < peopleCount; i++) {
                    const waitTime = Math.ceil((i + 1) * 1.2);
                    const isSelected = i + 1 === position;
                    const name = names[i % names.length];
                    const initial = name.charAt(0);
                    
                    html += `
                        <div class="queue-person-item ${isSelected ? 'ring-2 ring-blue-500' : ''}">
                            <div class="queue-person-avatar">${initial}</div>
                            <div class="queue-person-info">
                                <div class="queue-person-name">${name}</div>
                                <div class="queue-person-wait">已等待约 ${waitTime} 分钟</div>
                            </div>
                            <span class="queue-position">第${i + 1}位</span>
                        </div>
                    `;
                }
                
                html += '</div>';
                modalContent.innerHTML = html;
            }
            
            modal.classList.add('show');
        }

        /**
         * 显示菜单弹窗
         * @param {number} windowId - 窗口ID
         */
        function showMenuModal(windowId) {
            const windowData = windowsData.find(w => w.id === windowId);
            if (!windowData) return;
            
            const modal = document.getElementById('menu-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalContent = document.getElementById('modal-content');
            
            modalTitle.textContent = `${windowData.name} - 今日菜单`;
            
            // 根据窗口分类筛选菜单
            const category = windowData.category || '';
            const filteredMenu = category ? menuData.filter(item => item.category === category) : menuData;
            
            if (filteredMenu.length === 0) {
                modalContent.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-utensils"></i>
                        </div>
                        <p>暂无菜单信息</p>
                    </div>
                `;
            } else {
                let html = '';
                filteredMenu.forEach(item => {
                    html += `
                        <div class="menu-item">
                            <div class="menu-item-info">
                                <div class="menu-item-name">${item.name}</div>
                                <div class="menu-item-meta">
                                    <span><i class="fas fa-star text-yellow-400"></i> ${item.rating}</span>
                                    <span><i class="fas fa-shopping-cart text-blue-400"></i> 已售 ${item.sold}</span>
                                </div>
                            </div>
                            <div class="menu-item-price">¥${item.price}</div>
                        </div>
                    `;
                });
                modalContent.innerHTML = html;
            }
            
            modal.classList.add('show');
        }

        /**
         * 从API获取餐桌数据
         */
        async function fetchTables() {
            try {
                const response = await fetch(`${API_BASE}/tables`);
                const data = await response.json();
                updateTables(data);
            } catch (error) {
                console.error('获取餐桌数据失败:', error);
            }
        }

        // 存储餐桌数据
        let tablesData = [];

        /**
         * 更新餐桌显示
         * @param {Array} tables - 餐桌数据数组
         */
        function updateTables(tables) {
            tablesData = tables;
            const tableElements = document.querySelectorAll('.table');
            
            tableElements.forEach((table, index) => {
                const tableData = tables[index];
                if (!tableData) return;
                
                table.classList.remove('table-empty', 'table-occupied', 'table-maintenance');
                
                // 设置餐桌编号
                const tableNumber = index + 1;
                
                if (Math.random() > 0.98) {
                    table.classList.add('table-maintenance');
                    table.innerHTML = `
                        <div class="table-glow"></div>
                        <i class="fas fa-wrench text-yellow-600 text-xs"></i>
                        <span class="table-number">${tableNumber}</span>
                    `;
                } else if (tableData.isOccupied) {
                    table.classList.add('table-occupied');
                    table.innerHTML = `
                        <div class="table-glow"></div>
                        <i class="fas fa-users text-red-700 text-xs"></i>
                        <span class="text-red-800 font-bold">${tableData.currentPeople}/4</span>
                        <span class="table-number">${tableNumber}</span>
                    `;
                } else {
                    table.classList.add('table-empty');
                    table.innerHTML = `
                        <div class="table-glow"></div>
                        <i class="fas fa-chair text-green-700 text-xs"></i>
                        <span class="text-green-800 font-bold">空闲</span>
                        <span class="table-number">${tableNumber}</span>
                    `;
                }
            });
        }

        /**
         * 显示餐桌详情弹窗
         * @param {number} tableId - 餐桌ID
         */
        function showTableModal(tableId) {
            const tableData = tablesData.find(t => t.id === tableId);
            if (!tableData) return;
            
            const modal = document.getElementById('table-modal');
            const modalTitle = document.getElementById('table-modal-title');
            const modalContent = document.getElementById('table-modal-content');
            
            modalTitle.textContent = `餐桌 ${tableId} 详情`;
            
            if (!tableData.isOccupied) {
                modalContent.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-chair"></i>
                        </div>
                        <p>此餐桌当前空闲</p>
                        <p class="text-sm text-slate-400 mt-2">可容纳 4 人</p>
                    </div>
                `;
            } else {
                const peopleCount = tableData.currentPeople;
                const names = ['张三', '李四', '王五', '赵六', '钱七', '孙八', '周九', '吴十'];
                
                let html = `
                    <div class="mb-4 p-3 bg-slate-700 rounded-lg">
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-400">当前用餐人数</span>
                            <span class="font-bold text-blue-400">${peopleCount}人 / 4人</span>
                        </div>
                        <div class="flex justify-between text-sm mt-1">
                            <span class="text-slate-400">餐桌容量</span>
                            <span class="font-bold text-green-400">4人座</span>
                        </div>
                    </div>
                    <div class="space-y-2">
                `;
                
                for (let i = 0; i < peopleCount; i++) {
                    const duration = Math.floor(Math.random() * 30) + 5; // 5-35分钟
                    const name = names[i % names.length];
                    const initial = name.charAt(0);
                    
                    html += `
                        <div class="queue-person-item">
                            <div class="queue-person-avatar" style="background: linear-gradient(135deg, #fbbf24, #f59e0b);">${initial}</div>
                            <div class="queue-person-info">
                                <div class="queue-person-name">${name}</div>
                                <div class="queue-person-wait">已用餐 ${duration} 分钟</div>
                            </div>
                            <span class="queue-position">${i + 1}/4</span>
                        </div>
                    `;
                }
                
                // 添加空位显示
                for (let i = peopleCount; i < 4; i++) {
                    html += `
                        <div class="queue-person-item opacity-40">
                            <div class="queue-person-avatar" style="background: #4b5563;">?</div>
                            <div class="queue-person-info">
                                <div class="queue-person-name">空位</div>
                                <div class="queue-person-wait text-slate-500">等待入座</div>
                            </div>
                            <span class="queue-position">${i + 1}/4</span>
                        </div>
                    `;
                }
                
                html += '</div>';
                modalContent.innerHTML = html;
            }
            
            modal.classList.add('show');
        }

        /**
         * 从API获取统计数据
         */
        async function fetchStatistics() {
            try {
                const response = await fetch(`${API_BASE}/statistics`);
                const data = await response.json();
                updateStatistics(data);
            } catch (error) {
                console.error('获取统计数据失败:', error);
            }
        }

        /**
         * 更新统计数据显示
         * @param {Object} stats - 统计数据对象
         */
        function updateStatistics(stats) {
            document.getElementById('stat-people').textContent = stats.totalPeople;
            document.getElementById('stat-occupied').textContent = stats.occupiedTables;
            document.getElementById('stat-empty').textContent = stats.emptyTables;
            document.getElementById('stat-wait').textContent = `${stats.avgWaitTime}min`;
        }

        /**
         * 初始化餐桌布局
         */
        function initMap() {
            const map = document.getElementById('table-map');
            for (let i = 0; i < 80; i++) {
                const table = document.createElement('div');
                table.className = 'table rounded-lg flex items-center justify-center cursor-pointer hover:scale-110 transition';
                map.appendChild(table);
            }
        }

        /**
         * 综合更新函数
         */
        async function updateData() {
            await Promise.all([
                fetchWindows(),
                fetchTables(),
                fetchStatistics(),
                fetchMenu()
            ]);
        }

        /**
         * 初始化事件监听
         */
        function initEventListeners() {
            // 窗口卡片点击事件
            for (let i = 1; i <= 8; i++) {
                const windowCard = document.getElementById(`window-${i}`);
                const menuBtn = document.getElementById(`menu-btn-${i}`);
                
                if (windowCard) {
                    windowCard.addEventListener('click', (e) => {
                        // 如果点击的是排队小人，不触发菜单弹窗
                        if (!e.target.classList.contains('person')) {
                            const windowData = windowsData.find(w => w.id === i);
                            if (windowData && windowData.status !== 'closed') {
                                showMenuModal(i);
                            }
                        }
                    });
                }
                
                if (menuBtn) {
                    menuBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const windowData = windowsData.find(w => w.id === i);
                        if (windowData && windowData.status !== 'closed') {
                            showMenuModal(i);
                        }
                    });
                }
            }
            
            // 关闭菜单弹窗
            document.getElementById('modal-close').addEventListener('click', () => {
                document.getElementById('menu-modal').classList.remove('show');
            });
            
            // 关闭排队弹窗
            document.getElementById('queue-modal-close').addEventListener('click', () => {
                document.getElementById('queue-modal').classList.remove('show');
            });
            
            // 点击弹窗外部关闭
            document.getElementById('menu-modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('menu-modal')) {
                    document.getElementById('menu-modal').classList.remove('show');
                }
            });
            
            document.getElementById('queue-modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('queue-modal')) {
                    document.getElementById('queue-modal').classList.remove('show');
                }
            });
            
            // 关闭餐桌弹窗
            document.getElementById('table-modal-close').addEventListener('click', () => {
                document.getElementById('table-modal').classList.remove('show');
            });
            
            // 点击餐桌弹窗外部关闭
            document.getElementById('table-modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('table-modal')) {
                    document.getElementById('table-modal').classList.remove('show');
                }
            });
            
            // 餐桌点击事件
            const tableMap = document.getElementById('table-map');
            tableMap.addEventListener('click', (e) => {
                const tableElement = e.target.closest('.table');
                if (tableElement) {
                    const tables = document.querySelectorAll('.table');
                    const tableIndex = Array.from(tables).indexOf(tableElement);
                    const tableId = tableIndex + 1;
                    showTableModal(tableId);
                }
            });
        }

        /**
         * 页面初始化流程
         */
        initMap();
        initEventListeners();
        updateData();
        setInterval(updateData, 3000);
    </script>
